name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-dbt-models:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DBT_PROFILES_DIR: ci
      GBQ_PROJECT_ID: ${{ secrets.GBQ_PROJECT_ID }}
      GBQ_CI_DATASET: ${{ secrets.GBQ_CI_DATASET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Cheap check first: Python only, needs no login
      - name: Lint Python code
        run: ruff check .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install dbt packages
        run: dbt deps

      # Needs deps, the ci profile and the login
      - name: Lint SQL
        run: sqlfluff lint models analyses tests

      - name: Build and test dbt project
        run: dbt build